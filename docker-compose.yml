version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: zoneview_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoneview_user
      POSTGRES_PASSWORD: zoneview_password
      POSTGRES_DB: zoneview_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zoneview_user -d zoneview_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zoneview_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata: